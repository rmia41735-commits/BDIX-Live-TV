<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDIX Play V3 preview</title><style>*{box-sizing:border-box}body{margin:0;background:#080e1b;color:#edf4ff;font:16px system-ui}header,main{padding:20px;max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}button,input,select{font:inherit;padding:10px;border:1px solid #34465e;border-radius:8px;background:#142035;color:white}button{cursor:pointer}button:hover,button:focus-visible{border-color:#38bdf8}small{color:#aabbd0}h1{font-size:24px}.panel,.tile{background:#142035;border:1px solid #25354d;border-radius:12px;padding:18px}.screen{aspect-ratio:16/9;background:#03060b;display:grid;place-content:center;text-align:center;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.layout{display:grid;grid-template-columns:210px 1fr;gap:18px}nav button{display:block;width:100%;text-align:left;margin-bottom:6px}input{max-width:100%}[hidden]{display:none!important}@media(max-width:650px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;gap:6px}nav button{width:auto;white-space:nowrap}header,main{padding:12px}}</style><header><strong>BDIX PLAY / V3</strong><button id="toggle">Admin demo</button></header><main><p><small>ISOLATED PREVIEW · Sample data only · No production access</small></p><section id="viewer"><div class="screen"><h1 id="selected">Select a demo channel</h1><small>No live stream connected</small></div><div class="bar"><input id="search" placeholder="Search channels" aria-label="Search channels"><select id="category" aria-label="Category"><option>All</option><option>News</option><option>Sports</option><option>Entertainment</option></select></div><div class="grid" id="channels"></div></section><section id="admin" hidden><div class="layout"><nav id="nav" aria-label="Admin demo navigation"></nav><div><h1 id="heading">Dashboard</h1><div id="content"></div></div></div></section></main><script>const $=id=>document.getElementById(id);const data=[{name:'Demo News',category:'News'},{name:'Demo Sports',category:'Sports'},{name:'Demo Entertainment',category:'Entertainment'}];function tile(name,detail){const b=document.createElement('button');b.className='tile';b.textContent=name+' · '+detail;return b}function render(){ $('channels').replaceChildren();for(const c of data.filter(c=>($('category').value==='All'||c.category===$('category').value)&&c.name.toLowerCase().includes($('search').value.toLowerCase()))){const b=tile(c.name,c.category);b.onclick=()=>$('selected').textContent=c.name;$('channels').append(b)}}$('search').oninput=render;$('category').onchange=render;render();$('toggle').onclick=()=>{const show=$('admin').hidden;$('admin').hidden=!show;$('viewer').hidden=show;$('toggle').textContent=show?'Viewer home':'Admin demo'};const pages=['Dashboard','Channels','M3U Import','Categories','Channel Health','Live Viewers','Customization','Security','Settings'];function page(p){$('heading').textContent=p;const el=$('content');el.replaceChildren();const panel=document.createElement('div');panel.className='panel';el.append(panel);if(p==='Dashboard'){panel.className='grid';for(const [n,v] of [['Demo channels',3],['Live viewers','Not connected'],['Playlists',0],['Categories',3]]){const d=document.createElement('div');d.className='tile';d.textContent=n+': '+v;panel.append(d)}}else if(p==='M3U Import'){const label=document.createElement('p');label.textContent='Local playlist metadata preview only. No streams fetched or published.';const f=document.createElement('input');f.type='file';f.accept='.m3u,.m3u8';const out=document.createElement('pre');out.style.whiteSpace='pre-wrap';f.onchange=async()=>{const file=f.files[0];if(!file)return;if(file.size>2000000){out.textContent='File too large';return}const lines=(await file.text()).split(/\r?\n/).filter(l=>l.startsWith('#EXTINF:'));out.textContent=[...new Set(lines.map(l=>l.slice(l.lastIndexOf(',')+1).trim()))].slice(0,200).join('\n')||'No channel metadata found'};panel.append(label,f,out)}else if(p==='Channels'||p==='Categories'){for(const c of data){const d=document.createElement('p');d.textContent=p==='Channels'?c.name:c.category;panel.append(d)}}else{panel.textContent=({Security:'Demo only. Real administrator authentication must be enforced server-side.',Settings:'Public viewing without vouchers is the proposed production mode.',Customization:'Brand and layout settings will require backend integration.', 'Channel Health':'No live health checks in this isolated preview.','Live Viewers':'No real viewer tracking in this preview.'})[p]}}for(const p of pages){const b=document.createElement('button');b.textContent=p;b.onclick=()=>page(p);$('nav').append(b)}page('Dashboard');</script></html>
